# 컴포넌트 이미지를 빌드해 Gitea 컨테이너 레지스트리에 올린다.
#
# 이미지에 들어가는 파일(Dockerfile, lock 두 개, capstone_kfp/)이 바뀐 push에서만 돈다.
# pipeline.py만 바꾼 커밋은 이미지를 다시 만들지 않으므로, 컴파일할 때는 마지막으로 이 워크플로가
# 빌드한 커밋의 태그를 쓴다.
#
# 태그는 커밋 sha다. 이미지의 입력이 모두 이 커밋 안에 있고(해시로 고정한 lock, 다이제스트로 고정한
# 베이스, revision으로 고정한 토크나이저), 1주차처럼 저장소 밖 파일(모델)이 섞이지 않으므로
# lock 해시를 태그에 더하지 않는다.
#
# 러너의 dind는 클러스터 안 HTTP 주소를 insecure registry로 받아들인다. 로그인은 저장소 Secret
# REGISTRY_TOKEN(write:package 권한의 개인 액세스 토큰)과 워크플로를 실행한 사용자로 한다.
# 실행마다 자동으로 주어지는 GITEA_TOKEN으로는 레지스트리에 로그인할 수 없다.
name: image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.lock
      - requirements-kfp.lock
      - capstone_kfp/**
      - .gitea/workflows/image.yaml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY: gitea-http.gitea.svc.cluster.local:3000
    steps:
      - uses: actions/checkout@v4

      - name: Docker
        run: docker version --format 'client {{.Client.Version}}, server {{.Server.Version}} {{.Server.Arch}}'

      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USER: ${{ gitea.actor }}
        run: echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Build and push
        env:
          OWNER: ${{ gitea.repository_owner }}
          SHA: ${{ gitea.sha }}
        run: |
          # 레지스트리의 이미지 이름은 소문자여야 한다.
          image="$REGISTRY/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/capstone-kfp:$SHA"
          docker build --platform linux/arm64 --build-arg GIT_SHA="$SHA" -t "$image" .
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = arm64
          docker push "$image"
          echo "pushed $image"
          docker image inspect --format '{{index .RepoDigests 0}}' "$image"

      - name: Log out
        if: always()
        run: docker logout "$REGISTRY"
