# ../pipeline/bento/의 워크플로가 올린 이미지를 KServe(Standard 모드)로 띄운다.
# KServe가 Deployment와 Service capstone-url-classifier-predictor(80에서 3000으로)를 만든다.
# status.url은 쓰지 않는 ingress 도메인으로 만들어져 닿지 않는다. 주소는 status.address.url이다.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: capstone-url-classifier
  namespace: serving
  annotations:
    serving.kserve.io/autoscalerClass: none
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    # BentoML은 BENTOML_PORT를 포트로 읽는다. bentoml이라는 Service가 생기면 service link가 이 변수를 넣는다.
    enableServiceLinks: false
    # Pod Security restricted. 이미지는 USER bentoml로 이름만 적어서 숫자 uid를 준다.
    securityContext:
      runAsNonRoot: true
      runAsUser: 1034
      runAsGroup: 1034
      seccompProfile:
        type: RuntimeDefault
    containers:
      # 이름과 CPU, 메모리 네 값을 다 적어야 KServe webhook이 컨테이너를 고쳐 쓰지 않는다.
      - name: kserve-container
        image: git.example.dev/mlops-lab/capstone-bento:d608e0f356c917d8739c867f029d185e2154b070-v3@sha256:13838a8feba90fd8ce9e764f7f30045d4a8dba1f6a70815a56f18d7bfe3a83c9
        ports:
          - containerPort: 3000
            name: http1
            protocol: TCP
        env:
          - name: BENTOML_DO_NOT_TRACK
            value: "true"
          # torch는 지정하지 않으면 노드 코어 수만큼 스레드를 띄운다
          - name: OMP_NUM_THREADS
            value: "1"
        startupProbe:
          httpGet:
            path: /livez
            port: 3000
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
        livenessProbe:
          httpGet:
            path: /livez
            port: 3000
        # CPU 1개로 띄우면 약 3초 만에 준비되고 약 510 MiB를 쓴다
        resources:
          requests:
            cpu: 200m
            memory: 768Mi
          limits:
            cpu: "1"
            memory: 1536Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
