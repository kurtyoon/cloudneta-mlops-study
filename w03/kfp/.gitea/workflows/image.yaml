# 컴포넌트 이미지를 빌드해 Gitea 레지스트리에 올린다. 이미지 입력이 모두 커밋에 고정되어 있어 태그는 커밋 sha다.
# pipeline.py만 바꾼 커밋에서는 돌지 않으므로, 컴파일에는 마지막으로 빌드된 커밋의 태그를 쓴다.
# 레지스트리 로그인에는 write:package 권한의 개인 액세스 토큰 REGISTRY_TOKEN이 필요하다. GITEA_TOKEN으로는 안 된다.
name: image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.lock
      - requirements-kfp.lock
      - capstone_kfp/**
      - .gitea/workflows/image.yaml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY: gitea-http.gitea.svc.cluster.local:3000
    steps:
      - uses: actions/checkout@v4

      - name: Docker
        run: docker version --format 'client {{.Client.Version}}, server {{.Server.Version}} {{.Server.Arch}}'

      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USER: ${{ gitea.actor }}
        run: echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Build and push
        env:
          OWNER: ${{ gitea.repository_owner }}
          SHA: ${{ gitea.sha }}
        run: |
          # 레지스트리의 이미지 이름은 소문자여야 한다.
          image="$REGISTRY/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/capstone-kfp:$SHA"
          docker build --platform linux/arm64 --build-arg GIT_SHA="$SHA" -t "$image" .
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = arm64
          docker push "$image"
          echo "pushed $image"
          docker image inspect --format '{{index .RepoDigests 0}}' "$image"

      - name: Log out
        if: always()
        run: docker logout "$REGISTRY"
