# 서빙 predictor의 알림 규칙과 Grafana 대시보드. kube-prometheus-stack이 있는 monitoring 네임스페이스에 둔다.
# Alertmanager 설정은 Helm values라서 alertmanager-values.yaml에 따로 있다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - prometheusrule-serving.yaml
configMapGenerator:
  # Grafana sidecar가 이 라벨이 붙은 ConfigMap을 모두 대시보드로 읽는다. JSON은 dashboards/build.py가 쓴다.
  - name: dashboard-mlops-serving
    files:
      - mlops-serving.json=dashboards/mlops-serving.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
