# KFP 실습이 게시한 모델. 버킷 csi-volumes의 prefix models를 PV models-serving으로 묶는다(../manifests/csi-s3/models-pv.yaml). kubeflow의 PVC models와 같은 prefix다.
# InferenceService는 storageUri pvc://models/<path>로 한 버전을 읽는다. KServe가 이 PVC의 그 경로를 /mnt/models에 읽기 전용으로, storage-initializer와 복사 없이 마운트한다.
# GeeseFS가 노드에서 돌기 때문에(볼륨마다 systemd unit) serving Pod에는 모델을 읽기 위한 egress가 필요 없다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  annotations:
    # InferenceService(wave 0)가 마운트하기 전에 Bound가 되게 한다.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  storageClassName: ""
  volumeName: models-serving
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 10Gi
