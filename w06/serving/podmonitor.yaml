# Prometheus(kube-prometheus-stack)가 serving의 모든 predictor를 읽는다. KServe는 predictor Pod에
# serving.kserve.io/inferenceservice 라벨을 붙이고, predictor의 포트 이름은 모두 http1이다.
# - capstone-url-classifier: BentoML의 /metrics(3000). bentoml_service_* 요청 지표와 capstone_* 모델 지표
# - idcard-detector, movie-recommender: server.py의 /metrics(8080). predictor_* 요청 지표와 모델 출력
# KServe Standard 모드에는 queue-proxy가 없어 이 Pod 엔드포인트가 요청 지표의 전부다.
# Prometheus가 다른 네임스페이스의 PodMonitor를 고르도록(podMonitorSelectorNilUsesHelmValues: false) 설정해야 하고,
# serving에 NetworkPolicy가 있으면 Prometheus Pod에서 두 포트로 오는 요청을 열어야 한다.
#
# 모든 target에는 endpoint="http1"(포트 이름)이 붙는다. BentoML 요청 지표에도 endpoint(요청 경로)가 있어서,
# 충돌하면 Prometheus는 target의 값을 남기고 BentoML 값을 exported_endpoint로 옮긴다.
# metricRelabelings가 이것을 path로 옮겨, 쿼리는 path="/api/predict"로 읽는다.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: predictors
spec:
  selector:
    matchExpressions:
      - key: serving.kserve.io/inferenceservice
        operator: Exists
  podMetricsEndpoints:
    - port: http1
      path: /metrics
      interval: 30s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_serving_kserve_io_inferenceservice]
          targetLabel: inferenceservice
      metricRelabelings:
        - sourceLabels: [exported_endpoint]
          regex: (.+)
          targetLabel: path
        - action: labeldrop
          regex: exported_endpoint
